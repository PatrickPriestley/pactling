<script src='/javascripts/pagination.js?v=2.121.2' type='text/javascript'></script>
<script>
  const PAGE_NUMBER = 1;
  const PAGE_SIZE = 100;
  const TOTAL_NUMBER = 2
  const CURRENT_PAGE_SIZE = 2
  
  $(document).ready(function(){
    function createPageLink(pageNumber, pageSize) {
      const url = new URL(window.location)
      url.searchParams.set('page', pageNumber)
      url.searchParams.set('pageSize', pageSize)
      return url.toString()
    }
  
    function createFooter(currentPage, totalPage, totalNumber) {
      return `<div class='nav-footer'>${CURRENT_PAGE_SIZE} of ${totalNumber} pacts</div>`
    }
  
    $('div.pagination').pagination({
        dataSource: [],
        totalNumber: TOTAL_NUMBER,
        pageNumber: PAGE_NUMBER,
        pageSize: PAGE_SIZE,
        pageRange: 2,
        pageLink: createPageLink,
        ulClassName: 'pagination',
        footer: createFooter
    })
  });
</script>

<style>

<script>
  $(function(){
    $("#relationships").tablesorter();
  });
  
  $(document).ready(function(){
    $("span.pact a").load("/images/doc-text.svg");
    $("span.pact-matrix a").load("/images/doc-matrix.svg");
    $('td[data-toggle="tooltip"]').each(function(index, td){
      //appended tooltip div screws up table if it's appended after a
      //td, so need to append it to a div
      $(td).tooltip({container: $(td).first()});
    });
  
    $(function(){
      $(".table").on("click", "td[role=\"button\"]", function (e) {
        window.location = $(this).parent("tr").data("href");
      });
    });
  });
  
  $(".reset-search").on("click", function() {
    const url = new URL(window.location)
    url.searchParams.delete('search')
    window.location = url.toString();
  })
</script>
