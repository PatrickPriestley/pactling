services:
  pact-broker:
    # Replace pactfoundation/pact-broker with this image; remove the Postgres service
    # and PACT_BROKER_DATABASE_* settings. Existing Postgres data is not migrated.
    image: ghcr.io/patrickpriestley/pactling:latest
    build: .
    ports:
      - "9292:9292"
    environment:
      PACT_BROKER_PORT: "9292"
      PACTLING_DATABASE_URL: sqlite:///data/pactling.db?mode=rwc
      PACT_BROKER_BASIC_AUTH_USERNAME: ${PACT_BROKER_BASIC_AUTH_USERNAME:-}
      PACT_BROKER_BASIC_AUTH_PASSWORD: ${PACT_BROKER_BASIC_AUTH_PASSWORD:-}
      PACT_BROKER_BASIC_AUTH_READ_ONLY_USERNAME: ${PACT_BROKER_BASIC_AUTH_READ_ONLY_USERNAME:-}
      PACT_BROKER_BASIC_AUTH_READ_ONLY_PASSWORD: ${PACT_BROKER_BASIC_AUTH_READ_ONLY_PASSWORD:-}
      PACT_BROKER_ALLOW_PUBLIC_READ: ${PACT_BROKER_ALLOW_PUBLIC_READ:-false}
      PACTLING_BEARER_TOKEN: ${PACTLING_BEARER_TOKEN:-}
      PACT_BROKER_WEBHOOK_SCHEME_WHITELIST: ${PACT_BROKER_WEBHOOK_SCHEME_WHITELIST:-https}
      PACT_BROKER_WEBHOOK_HOST_WHITELIST: ${PACT_BROKER_WEBHOOK_HOST_WHITELIST:-}
      PACT_BROKER_WEBHOOK_HTTP_METHOD_WHITELIST: ${PACT_BROKER_WEBHOOK_HTTP_METHOD_WHITELIST:-POST}
      PACT_BROKER_WEBHOOK_HTTP_CODE_SUCCESS: ${PACT_BROKER_WEBHOOK_HTTP_CODE_SUCCESS:-200 201 202 203 204 205 206}
      PACT_BROKER_WEBHOOK_RETRY_SCHEDULE: ${PACT_BROKER_WEBHOOK_RETRY_SCHEDULE:-10 60 120 300 600 1200}
      PACTLING_WEBHOOK_INITIAL_DELAY: ${PACTLING_WEBHOOK_INITIAL_DELAY:-5}
      PACTLING_WEBHOOK_DELAY_STEP: ${PACTLING_WEBHOOK_DELAY_STEP:-3}
    volumes:
      - pact-data:/data
    restart: unless-stopped
volumes:
  pact-data:
